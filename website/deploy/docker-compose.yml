services:
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.lanshare-ftp.rule=Host(`lanshare-ftp.byteworkstation.online`)
      - traefik.http.routers.lanshare-ftp.entrypoints=websecure
      - traefik.http.routers.lanshare-ftp.tls.certresolver=myresolver
      - traefik.http.services.lanshare-ftp.loadbalancer.server.port=80

networks:
  traefik:
    external: true
