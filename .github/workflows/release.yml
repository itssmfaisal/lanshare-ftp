name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Downloads
            | Platform | File |
            |---|---|
            | Windows (installer) | `LanShare-FTP-*-win-setup.exe` |
            | Windows (portable, no install) | `LanShare-FTP-*-win-portable.exe` |
            | macOS Apple Silicon (M1/M2/M3…) | `LanShare-FTP-*-mac-arm64.dmg` |
            | macOS Intel | `LanShare-FTP-*-mac-x64.dmg` |
            | Linux (any distro) | `LanShare-FTP-*-linux-x86_64.AppImage` |
            | Debian / Ubuntu | `LanShare-FTP-*-linux-amd64.deb` |

            **Notes:** the builds are not code-signed.
            - **Windows:** SmartScreen may warn. Click *More info* → *Run anyway*.
            - **macOS:** if it says the app "is damaged", run `xattr -cr "/Applications/LanShare FTP.app"`, or right-click the app and choose *Open*.
            - **AppImage:** `chmod +x LanShare-FTP-*.AppImage`, then run it. On Ubuntu 22.04+ you may need `sudo apt install libfuse2t64` (or `libfuse2`).
